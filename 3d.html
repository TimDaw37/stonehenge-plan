const COL = { sarsen: 0x8a8680, blue: 0x9aa8b4, sand: 0xb4a792 };

const viewport = document.getElementById("viewport");
const read = document.getElementById("read");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d3ca);
const camera = new THREE.PerspectiveCamera(45, 1, 0.2, 400);
camera.position.set(28, 42, 62);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.2, 0);
controls.minDistance = 12;
controls.maxDistance = 160;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xf2efe8, 0x6b655c, 1.1));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.85);
sun.position.set(40, 70, 25);
scene.add(sun);

const base = new THREE.Mesh(
  new THREE.CircleGeometry(78, 72),
  new THREE.MeshLambertMaterial({ color: 0xc9c2b6, side: THREE.DoubleSide })
);
base.rotation.x = -Math.PI / 2;
base.receiveShadow = true;
scene.add(base);

function shapeFrom(ring) {
  const sh = new THREE.Shape();
  ring.forEach((p, i) => {
    if (i === 0) sh.moveTo(p[0], p[1]);
    else sh.lineTo(p[0], p[1]);
  });
  return sh;
}

DATA.stones.forEach((s) => {
  if (!s.ring || s.ring.length < 4) return;
  const lintel = !!s.lintel;
  const depth = lintel ? 0.75 : s.h;
  let geo;
  try {
    geo = new THREE.ExtrudeGeometry(shapeFrom(s.ring), {
      depth,
      bevelEnabled: true,
      bevelThickness: Math.min(0.07, depth * 0.12),
      bevelSize: 0.06,
      bevelSegments: 1,
    });
  } catch (e) {
    return;
  }
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshLambertMaterial({
    color: COL[s.kind] || COL.sarsen,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = lintel ? 4.15 : 0.01;
  mesh.userData.id = s.id;
  scene.add(mesh);
});

const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
viewport.addEventListener("pointermove", (ev) => {
  const r = viewport.getBoundingClientRect();
  mouse.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(scene.children, false).find((h) => h.object.userData.id);
  read.textContent = hit ? "stone " + hit.object.userData.id : "drag to turn the base";
});

function resize() {
  const r = viewport.getBoundingClientRect();
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
  renderer.setSize(r.width, r.height, false);
}
window.addEventListener("resize", resize);
resize();

document.getElementById("reset").onclick = () => {
  camera.position.set(28, 42, 62);
  controls.target.set(0, 1.2, 0);
};
document.getElementById("top").onclick = () => {
  camera.position.set(0, 90, 0.2);
  controls.target.set(0, 0, 0);
};

function tick() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>

</html>
