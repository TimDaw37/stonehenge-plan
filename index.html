* { box-sizing: border-box; }
html, body {

body {

header { padding: 14px 18px 6px; }

}

  height: 14px;
  margin: -8px 0 0 -8px;

  border-radius: 50%;

  pointer-events: none;
}
#pin:not([hidden]) { display: block; }
#bar {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 16px;
  padding: 8px 18px;
  font: 14px/1.4 ui-monospace, Consolas, monospace;
}
#read { margin: 0; flex: 1 1 16em; }
#pinned-read { margin: 0; color: #a30; }
#tools { display: flex; gap: 6px; }
button {

  padding: 3px 10px;
  border: 1px solid #bbb;
  background: #fff;
  cursor: pointer;
}
button:hover { background: #eee; }

dPv3Tjxo03vOEN1f/93//t7OxYNgAAAAAAAAAAIAHWaY8++ujzzz9fPf/8848++qi1AQAAAAAAAAAAcgThBX35y19+8sknf/7zn7/5zW9+7rnnrA0AAAAAAAAAAJAA63yvvfba9C8eeOCBX/ziF+f/mnv/AgAAAAAAAAAAIEcQAgAAAAAAAAAAJMACAAAAAAAAAABIgAUAAAAAAAAAAEACLAAAAAAAAAAAgARYAAAAAAAAAAAACbAAAAAAAAAAAAA21/V1/R9fu3bN1WcZjo+PXQQAAAAAAAAAADIBCwAAAAAAAAAAIAEWAAAAAAAAAABAAiwAAAAAAAAAAACmrq/r//j4+PiyHzKZTHZ3d60ZAAAAAAAAAACQCVgAAAAAAAAAAAAJsAAAAAAAAAAAABJgAQAAAAAAAAAAkAALAAAAAAAAAAAgARYAAAAAAAAAAEACLAAAAAAAAAAAgARYAAAAAAAAAAAACbAAAAAAAAAAAABIgAUAAAAAAAAAAJAACwAAAAAAAAAAIAEWAAAAAAAAAABAAiwAAAAAAAAAAAASYAEAAAAAAAAAACTAAgAAAAAAAAAASIAFAAAAAAAAAACQAAsAAAAAAAAAACABFgAAAAAAAAAAAAmwAAAAAAAAAAAAEmABAAAAAAAAAAAkwAIAAAAAAAAAAEiABQAAAAAAAAAAkAALAAAAAAAAAACABFgAAAAAAAAAAAAJsAAAAAAAAAAAABJgAQAAAAAAAAAAJMACAAAAAAAAAABIgAUAAAAAAAAAAEACLAAAAAAAAAAAgARYAAAAAAAAAAD8f7t2TAAAAIAwaP1T+5sBcgAkYAEAAAAAAAAAACRgAQAAAAAAAAAAkIAFAAAAAAAAAACQgAUAAAAAAAAAAJCABQAAAAAAAAAAkIAFAAAAAAAAAACQgAUAAAAAAAAAAMAZ/mmSIASNEGQAAAAASUVORK5CYII=" alt="A georeferenced plan of Stonehenge" draggable="false">
    <div id="pin" hidden></div>
  </div>
</div>
<div id="bar">
  <p id="read"></p>
  <p id="pinned-read"></p>
  <div id="tools">
    <button type="button" id="zoom-in" title="Zoom in">+</button>
    <button type="button" id="zoom-out" title="Zoom out">−</button>
    <button type="button" id="reset" title="Reset view">Reset</button>
    <button type="button" id="copy" title="Copy pinned coordinate">Copy</button>
  </div>
</div>
<script>
/* Georeferenced Stonehenge plan: pan, zoom, pin, OSGB + WGS84. */
(function () {
  const E0 = 412197.13, N1 = 142273.90, MPP = 0.05;
  const CE = 412268.297, CN = 142194.322;
  const LON0 = -1.8258721446712087, LAT0 = 51.17885348545319;
  const DLON_DE = 1.43057851e-5, DLON_DN = 3.38457622e-8;
  const DLAT_DE = -2.12814168e-8, DLAT_DN = 8.99191399e-6;

  const viewport = document.getElementById("viewport");
  const map = document.getElementById("map");
  const img = document.getElementById("plan");
  const pin = document.getElementById("pin");
  const read = document.getElementById("read");
  const pinnedRead = document.getElementById("pinned-read");
  const copyBtn = document.getElementById("copy");

  let scale = 1, tx = 0, ty = 0, fit = 1;
  let nw = 3200, nh = 3000;
  let dragging = false, moved = false, lastX = 0, lastY = 0;
  let pinned = null;

  function apply() {
    map.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
  }

  function fitView() {
    const r = viewport.getBoundingClientRect();
    if (!r.width || !r.height) return;
    fit = Math.min(r.width / nw, r.height / nh);
    scale = fit;
    tx = (r.width - nw * scale) / 2;
    ty = (r.height - nh * scale) / 2;
    apply();
  }

  function clientToPx(cx, cy) {
    const r = viewport.getBoundingClientRect();
    return { x: (cx - r.left - tx) / scale, y: (cy - r.top - ty) / scale };
  }

  function wgs(E, N) {
    const dE = E - CE, dN = N - CN;
    return {
      lon: LON0 + DLON_DE * dE + DLON_DN * dN,
      lat: LAT0 + DLAT_DE * dE + DLAT_DN * dN,
    };
  }

  function atPx(x, y) {
    const E = E0 + x * MPP;
    const N = N1 - y * MPP;
    const su =
      "SU " +
      String(Math.round(E - 400000)).padStart(5, "0") +
      " " +
      String(Math.round(N - 100000)).padStart(5, "0");
    const g = wgs(E, N);
    const W = g.lon < 0 ? "W" : "E";
    return {
      x, y, E, N, su,
      lat: g.lat,
      lon: g.lon,
      text:
        "E " + E.toFixed(2) +
        "   N " + N.toFixed(2) +
        "   " + su +
        "   " + g.lat.toFixed(6) + "° N  " + Math.abs(g.lon).toFixed(6) + "° " + W,
      short: "E " + E.toFixed(2) + "  N " + N.toFixed(2) + "  " + su,
    };
  }

  function onMap(p) {
    return p && p.x >= 0 && p.y >= 0 && p.x <= nw && p.y <= nh;
  }

  function showLive(p) {
    read.textContent = onMap(p) ? p.text : "";
  }

  function showPinned() {
    if (!pinned) {
      pinnedRead.textContent = "";
      pin.hidden = true;
      return;
    }
    pinnedRead.textContent = "pinned  " + pinned.short;
    pin.hidden = false;
    pin.style.left = pinned.x + "px";
    pin.style.top = pinned.y + "px";
  }

  function pinAt(p) {
    if (!onMap(p)) return;
    pinned = p;
    showPinned();
  }

  function zoomAt(cx, cy, factor) {
    const p = clientToPx(cx, cy);
    const next = Math.min(fit * 16, Math.max(fit * 0.85, scale * factor));
    const r = viewport.getBoundingClientRect();
    tx = cx - r.left - p.x * next;
    ty = cy - r.top - p.y * next;
    scale = next;
    apply();
  }

  function onLoad() {
    nw = img.naturalWidth || nw;
    nh = img.naturalHeight || nh;
    img.style.width = nw + "px";
    img.style.height = nh + "px";
    fitView();
  }
  img.addEventListener("load", onLoad);
  if (img.complete && img.naturalWidth) onLoad();

  window.addEventListener("resize", function () {
    const keep = pinned;
    fitView();
    pinned = keep;
    showPinned();
  });

  viewport.addEventListener(
    "wheel",
    function (ev) {
      ev.preventDefault();
      zoomAt(ev.clientX, ev.clientY, ev.deltaY < 0 ? 1.14 : 1 / 1.14);
    },
    { passive: false }
  );

  viewport.addEventListener("pointerdown", function (ev) {
    if (ev.button !== 0) return;
    dragging = true;
    moved = false;
    lastX = ev.clientX;
    lastY = ev.clientY;
    viewport.setPointerCapture(ev.pointerId);
  });

  viewport.addEventListener("pointermove", function (ev) {
    if (dragging) {
      const dx = ev.clientX - lastX;
      const dy = ev.clientY - lastY;
      if (Math.hypot(dx, dy) > 4) moved = true;
      if (moved) {
        tx += dx;
        ty += dy;
        lastX = ev.clientX;
        lastY = ev.clientY;
        apply();
      }
      return;
    }
    const xy = clientToPx(ev.clientX, ev.clientY);
    showLive(atPx(xy.x, xy.y));
  });

  viewport.addEventListener("pointerup", function (ev) {
    if (!dragging) return;
    dragging = false;
    if (!moved) {
      const xy = clientToPx(ev.clientX, ev.clientY);
      pinAt(atPx(xy.x, xy.y));
    }
  });

  viewport.addEventListener("pointercancel", function () {
    dragging = false;
  });

  viewport.addEventListener("dblclick", function (ev) {
    ev.preventDefault();
    zoomAt(ev.clientX, ev.clientY, 1.6);
  });

  document.getElementById("zoom-in").addEventListener("click", function () {
    const r = viewport.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25);
  });
  document.getElementById("zoom-out").addEventListener("click", function () {
    const r = viewport.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.25);
  });
  document.getElementById("reset").addEventListener("click", function () {
    pinned = null;
    showPinned();
    fitView();
    read.textContent = "";
  });

  copyBtn.addEventListener("click", function () {
    if (!pinned) return;
    navigator.clipboard.writeText(pinned.short).then(function () {
      copyBtn.textContent = "Copied";
      setTimeout(function () {
        copyBtn.textContent = "Copy";
      }, 1200);
    });
  });
})();

</script>
