<style>
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
}
body {
  font: 15px/1.45 Georgia, "Times New Roman", serif;
  color: #111;
  background: #f4f4f0;
  display: flex;
  flex-direction: column;
}
header { padding: 14px 18px 6px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
.note {
  margin: 6px 0 0;
  font: 13px/1.4 Georgia, "Times New Roman", serif;
  color: #555;
}
#viewport {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
  margin: 0 18px;
  border: 1px solid #ccc;
  background: #fff;
  cursor: crosshair;
  touch-action: none;
  min-height: 280px;
}
#map {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
}
#lidar, #plan {
  display: block;
  position: absolute;
  left: 0;
  top: 0;
  user-select: none;
  -webkit-user-drag: none;
}
#lidar { z-index: 0; }
#lidar.off { display: none; }
#plan { z-index: 1; }
#map.lidar-on { isolation: isolate; }
#map.lidar-on #plan { mix-blend-mode: multiply; }
#lidar-btn[aria-pressed="true"] { background: #e8e4dc; }
#labels {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
}
#labels.off { display: none; }
#labels span {
  position: absolute;
  transform: translate(-30%, -70%);
  font: 700 15px Arial, Helvetica, sans-serif;
  color: #111;
  text-shadow:
    -1px -1px 0 #fff, 1px -1px 0 #fff,
    -1px 1px 0 #fff, 1px 1px 0 #fff;
  white-space: nowrap;
}
#numbers[aria-pressed="true"] { background: #e8e4dc; }
#pin {
  z-index: 3;
  position: absolute;
  width: 14px;
  height: 14px;
  margin: -8px 0 0 -8px;
  border: 2px solid #c40;
  border-radius: 50%;
  box-shadow: 0 0 0 1px #fff;
  pointer-events: none;
}
#pin:not([hidden]) { display: block; }
#bar {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 16px;
  padding: 8px 18px;
  font: 14px/1.4 ui-monospace, Consolas, monospace;
}
#read { margin: 0; flex: 1 1 16em; }
#pinned-read { margin: 0; color: #a30; }
#tools { display: flex; gap: 6px; }
button {
  font: 13px/1.2 Georgia, serif;
  padding: 3px 10px;
  border: 1px solid #bbb;
  background: #fff;
  cursor: pointer;
}
button:hover { background: #eee; }

</style>

  }

  function showPinned() {
    if (!pinned) {
      pinnedRead.textContent = "";
      pin.hidden = true;
      return;
    }
    pinnedRead.textContent = "pinned  " + pinned.short;
    pin.hidden = false;
    pin.style.left = pinned.x + "px";
    pin.style.top = pinned.y + "px";
  }

  function pinAt(p) {
    if (!onMap(p)) return;
    pinned = p;
    showPinned();
  }

  function zoomAt(cx, cy, factor) {
    const p = clientToPx(cx, cy);
    const next = Math.min(fit * 16, Math.max(fit * 0.85, scale * factor));
    const r = viewport.getBoundingClientRect();
    tx = cx - r.left - p.x * next;
    ty = cy - r.top - p.y * next;
    scale = next;
    apply();
  }

  function drawLabels() {
    if (!labelsEl || typeof LABELS === "undefined") return;
    labelsEl.innerHTML = "";
    for (let i = 0; i < LABELS.length; i++) {
      const L = LABELS[i];
      const s = document.createElement("span");
      s.style.left = L.x + "px";
      s.style.top = L.y + "px";
      s.textContent = L.id;
      labelsEl.appendChild(s);
    }
  }

  function setNumbers(on) {
    if (!numBtn || !labelsEl) return;
    numBtn.setAttribute("aria-pressed", on ? "true" : "false");
    numBtn.textContent = on ? "hide numbers" : "show numbers";
    labelsEl.classList.toggle("off", !on);
  }

  function setLidar(on) {
    if (!lidarBtn || !lidarImg) return;
    lidarBtn.setAttribute("aria-pressed", on ? "true" : "false");
    lidarBtn.textContent = on ? "hide lidar" : "show lidar";
    lidarImg.classList.toggle("off", !on);
    map.classList.toggle("lidar-on", on);
  }

  function sizeMap() {
    map.style.width = nw + "px";
    map.style.height = nh + "px";
    img.style.width = nw + "px";
    img.style.height = nh + "px";
    if (lidarImg) {
      lidarImg.style.width = nw + "px";
      lidarImg.style.height = nh + "px";
    }
  }

  function onLoad() {
    nw = img.naturalWidth || nw;
    nh = img.naturalHeight || nh;
    sizeMap();
    drawLabels();
    fitView();
  }
  img.addEventListener("load", onLoad);
  if (img.complete && img.naturalWidth) onLoad();

  window.addEventListener("resize", function () {
    const keep = pinned;
    fitView();
    pinned = keep;
    showPinned();
  });

  viewport.addEventListener(
    "wheel",
    function (ev) {
      ev.preventDefault();
      zoomAt(ev.clientX, ev.clientY, ev.deltaY < 0 ? 1.14 : 1 / 1.14);
    },
    { passive: false }
  );

  viewport.addEventListener("pointerdown", function (ev) {
    if (ev.button !== 0) return;
    dragging = true;
    moved = false;
    lastX = ev.clientX;
    lastY = ev.clientY;
    viewport.setPointerCapture(ev.pointerId);
  });

  viewport.addEventListener("pointermove", function (ev) {
    if (dragging) {
      const dx = ev.clientX - lastX;
      const dy = ev.clientY - lastY;
      if (Math.hypot(dx, dy) > 4) moved = true;
      if (moved) {
        tx += dx;
        ty += dy;
        lastX = ev.clientX;
        lastY = ev.clientY;
        apply();
      }
      return;
    }
    const xy = clientToPx(ev.clientX, ev.clientY);
    showLive(atPx(xy.x, xy.y));
  });

  viewport.addEventListener("pointerup", function (ev) {
    if (!dragging) return;
    dragging = false;
    if (!moved) {
      const xy = clientToPx(ev.clientX, ev.clientY);
      pinAt(atPx(xy.x, xy.y));
    }
  });

  viewport.addEventListener("pointercancel", function () {
    dragging = false;
  });

  viewport.addEventListener("dblclick", function (ev) {
    ev.preventDefault();
    zoomAt(ev.clientX, ev.clientY, 1.6);
  });

  document.getElementById("zoom-in").addEventListener("click", function () {
    const r = viewport.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25);
  });
  document.getElementById("zoom-out").addEventListener("click", function () {
    const r = viewport.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.25);
  });
  document.getElementById("reset").addEventListener("click", function () {
    pinned = null;
    showPinned();
    fitView();
    read.textContent = "";
  });

  if (numBtn && labelsEl) {
    setNumbers(false);
    numBtn.addEventListener("click", function () {
      setNumbers(numBtn.getAttribute("aria-pressed") !== "true");
    });
  }

  if (lidarBtn && lidarImg) {
    setLidar(false);
    lidarBtn.addEventListener("click", function () {
      setLidar(lidarBtn.getAttribute("aria-pressed") !== "true");
    });
  }

  copyBtn.addEventListener("click", function () {
    if (!pinned) return;
    navigator.clipboard.writeText(pinned.short).then(function () {
      copyBtn.textContent = "Copied";
      setTimeout(function () {
        copyBtn.textContent = "Copy";
      }, 1200);
    });
  });
})();

</script>
</body>
</html>
