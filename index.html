<style>
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
}
body {
  font: 15px/1.45 Georgia, "Times New Roman", serif;
  color: #111;
  background: #f4f4f0;
  display: flex;
  flex-direction: column;
}
header { padding: 14px 18px 6px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
.note {
  margin: 6px 0 0;
  font: 13px/1.4 Georgia, "Times New Roman", serif;
  color: #555;
}
#viewport {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
  margin: 0 18px;
  border: 1px solid #ccc;
  background: #fff;
  cursor: crosshair;
  touch-action: none;
  min-height: 280px;
}
#map {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
}
#map img {
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}
#labels {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
}
#labels.off { display: none; }
#labels span {
  position: absolute;
  transform: translate(-30%, -70%);
  font: 700 15px Arial, Helvetica, sans-serif;
  color: #111;
  text-shadow:
    -1px -1px 0 #fff, 1px -1px 0 #fff,
    -1px 1px 0 #fff, 1px 1px 0 #fff;
  white-space: nowrap;
}
#numbers[aria-pressed="true"] { background: #e8e4dc; }
#pin {
  position: absolute;
  width: 14px;
  height: 14px;
  margin: -8px 0 0 -8px;
  border: 2px solid #c40;
  border-radius: 50%;
  box-shadow: 0 0 0 1px #fff;
  pointer-events: none;
}
#pin:not([hidden]) { display: block; }
#bar {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 16px;
  padding: 8px 18px;
  font: 14px/1.4 ui-monospace, Consolas, monospace;
}
#read { margin: 0; flex: 1 1 16em; }
#pinned-read { margin: 0; color: #a30; }
#tools { display: flex; gap: 6px; }
button {
  font: 13px/1.2 Georgia, serif;
  padding: 3px 10px;
  border: 1px solid #bbb;
  background: #fff;
  cursor: pointer;
}
button:hover { background: #eee; }

</style>

  function apply() {

  }

  function fitView() {
    const r = viewport.getBoundingClientRect();
    if (!r.width || !r.height) return;
    fit = Math.min(r.width / nw, r.height / nh);
    scale = fit;
    tx = (r.width - nw * scale) / 2;
    ty = (r.height - nh * scale) / 2;

    const r = viewport.getBoundingClientRect();
    return { x: (cx - r.left - tx) / scale, y: (cy - r.top - ty) / scale };
  }

  function wgs(E, N) {

    return {
      lon: LON0 + DLON_DE * dE + DLON_DN * dN,
      lat: LAT0 + DLAT_DE * dE + DLAT_DN * dN,
    };

  function atPx(x, y) {
    const E = AE * x + BE;
    const N = AN * y + BN;
    const su =
      "SU " +
      String(Math.round(E - 400000)).padStart(5, "0") +
      " " +
      String(Math.round(N - 100000)).padStart(5, "0");
    const g = wgs(E, N);
    const W = g.lon < 0 ? "W" : "E";
    return {
      x, y, E, N, su,
      lat: g.lat,
      lon: g.lon,
      text:

        "   N " + N.toFixed(2) +

    }
    const xy = clientToPx(ev.clientX, ev.clientY);
    showLive(atPx(xy.x, xy.y));
  });

  viewport.addEventListener("pointerup", function (ev) {
    if (!dragging) return;
    dragging = false;
    if (!moved) {
      const xy = clientToPx(ev.clientX, ev.clientY);
      pinAt(atPx(xy.x, xy.y));
    }
  });

  viewport.addEventListener("pointercancel", function () {
    dragging = false;
  });

  viewport.addEventListener("dblclick", function (ev) {
    ev.preventDefault();
    zoomAt(ev.clientX, ev.clientY, 1.6);
  });

  document.getElementById("zoom-in").addEventListener("click", function () {
    const r = viewport.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25);
  });
  document.getElementById("zoom-out").addEventListener("click", function () {
    const r = viewport.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.25);
  });
  document.getElementById("reset").addEventListener("click", function () {
    pinned = null;
    showPinned();
    fitView();
    read.textContent = "";
  });

  if (numBtn && labelsEl) {
    setNumbers(false);
    numBtn.addEventListener("click", function () {
      setNumbers(numBtn.getAttribute("aria-pressed") !== "true");
    });
  }

  copyBtn.addEventListener("click", function () {
    if (!pinned) return;
    navigator.clipboard.writeText(pinned.short).then(function () {
      copyBtn.textContent = "Copied";
      setTimeout(function () {
        copyBtn.textContent = "Copy";
      }, 1200);
    });
  });
})();

</script>
</body>
</html>
